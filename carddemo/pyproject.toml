[project]
name = "carddemo"
version = "0.1.0"
description = "CardDemo - COBOL-to-Python migration of mainframe credit card management system"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0,<6.0",
    "psycopg[binary]>=3.1,<4.0",
    "django-environ>=0.11,<1.0",
    "gunicorn>=21.2,<23.0",
    "argon2-cffi>=23.1,<24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-django>=4.7,<5.0",
    "pytest-cov>=5.0,<6.0",
    "factory-boy>=3.3,<4.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.9,<2.0",
    "django-stubs>=5.0,<6.0",
]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106"]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "core", "carddemo"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "carddemo.settings.testing"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "carddemo.settings.testing"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
